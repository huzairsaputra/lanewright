<text x="24" y="60" class="mu" font-size="12" font-weight="400" text-anchor="start">Wall seconds per run, cost in US dollars. One headless process each, claude-opus-5-5, 7 Nov 2026.</text>
<line x1="24" x2="796" y1="84" y2="84" class="ln"/>
<text x="24" y="106" class="fg" font-size="13" font-weight="600" text-anchor="start">fix-planning</text>
<text x="24" y="122" class="mu" font-size="11" font-weight="400" text-anchor="start">Lanewright Planning / fixes 1-5 + SHA-256</text>
<rect x="290" y="92" width="298.6" height="22" rx="3" class="pl"/>
<text x="596.6326767091541" y="108" class="fg" font-size="13" font-weight="600" text-anchor="start">758 s</text>
<text x="796" y="108" class="mu" font-size="12" font-weight="400" text-anchor="end">$2.93 · 83 turns</text>
