<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 300" width="880" height="300" role="img" aria-label="Lanewright fair benchmark: 6/6 vs 3/6 runs that met every checked Definition-of-Done item, with vs without the pack; 26/26 merges after a green CI run on the PR head, in all 12 runs (both arms); $5.49 vs $3.55 mean Claude cost per sprint, with vs without the pack; $3.17 with the pack&#x27;s cost settings (orchestrator on Sonnet 5.5), 3/3 complete">
