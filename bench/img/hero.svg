<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 290" width="880" height="290" role="img" aria-label="scrum-kit benchmark: 4/4 items merged only after a green CI run and a CLEAN review; 0 files committed outside a role&#x27;s region; 2 writes into another module caught by --check before commit (Codex run); 1 real defect caught by the separate QA role before merge (Codex run)">
